// Earth trajectory example. The bundled Earth data is for engineering smoke validation.

body = "Earth";
body_model_file = "vendor/damascus/data/earth_prem.dat";
body_composition = "layered";

output_dir = "./output";
clear_existing_trajectories = true;

sample_size = 1000;
max_trajectories = 100000;
capture_mode = false;

initial_radius_body_radius = 2.0;
asymptotic_distance_body_radius = 1000.0;
bincount_max_radius_body_radius = 2.0;
interpolation_points = 1000;
maximum_number_of_scatterings = 100000000000000L;
maximum_free_time_steps = 1000000000000L;
max_trajectory_wall_time_sec = 300.0;

trajectory_write_stride = 1;
txt_precision = 10;

DM_mass = 0.5;
DM_spin = 0.5;
DM_fraction = 1.0;
DM_light = true;

DM_interaction = "SD";
DM_isospin_conserved = true;
DM_relative_couplings = (1.0, 1.0);
DM_cross_section_nucleon = 1.0e-39;
DM_cross_section_electron = 1.0e-80;
DM_form_factor = "Contact";
DM_mediator_mass = 0.0;

DM_distribution = "SHM";
DM_local_density = 0.4;
SHM_v0 = 220.0;
SHM_vObserver = (11.1, 232.2, 7.3);
SHM_vEscape = 544.0;